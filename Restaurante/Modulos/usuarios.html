<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuarios</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

    <link rel="stylesheet" href="../css/usuarios.css">
    <link rel="stylesheet" href="../css/sweetalert.css">

</head>

<body>

    <nav class="navbar">

        <div class="navbar-brand">

            <a class="navbar-item">
                Registro de Usuarios
            </a>

        </div>

    </nav>

    <div class="contenedor">

        <div class="box-formulario">

            <div class="columns">

                <div class="column">

                    <div class="field">

                        <label class="label">Ingresa tu nombre</label>

                        <div class="control">

                            <input
                                class="input"
                                type="text"
                                id="nombre_usuarios"
                                placeholder="Ej: Mattias">

                        </div>

                    </div>

                    <div class="field">

                        <label class="label">Ingresa tu apellido</label>

                        <div class="control">

                            <input
                                class="input"
                                type="text"
                                id="apellido"
                                placeholder="Ej: Vargas López">

                        </div>

                    </div>

                    <div class="field">

                        <label class="label">Tipo de documento</label>

                        <label class="radio">

                            <input
                                type="radio"
                                name="tipo_documento"
                                value="TI">

                            TI

                        </label>

                        <label class="radio">

                            <input
                                type="radio"
                                name="tipo_documento"
                                value="CC">

                            CC

                        </label>

                    </div>

                    <div class="field">

                        <label class="label">Número de documento</label>

                        <div class="control">

                            <input
                                class="input"
                                type="text"
                                id="documento"
                                placeholder="Ej: 1234567890">

                        </div>

                    </div>

                    <div class="field">

                        <label class="label">Teléfono</label>

                        <div class="control">

                            <input
                                class="input"
                                type="text"
                                id="telefono_usuarios"
                                placeholder="Ej: 3201234567">

                        </div>

                    </div>

                </div>

                <div class="column">

                    <div class="field">

                        <label class="label">Correo electrónico</label>

                        <div class="control">

                            <input
                                class="input"
                                type="email"
                                id="email"
                                placeholder="Ej: correo@gmail.com">

                        </div>

                    </div>

                    <div class="field">

                        <label class="label">Contraseña</label>

                        <div class="control">

                            <input
                                class="input"
                                type="password"
                                id="password"
                                placeholder="Ingrese una contraseña">

                        </div>

                    </div>

                    <div class="field">

                        <label class="label">Fecha de nacimiento</label>

                        <div class="control">

                            <input
                                class="input"
                                type="date"
                                id="fecha_nacimiento">

                        </div>

                    </div>

                    <div class="field">

                        <label class="label">Género</label>

                        <div class="control">

                            <div class="select is-fullwidth">

                                <select id="genero">

                                    <option value="">Seleccione su género</option>

                                    <option value="Masculino">Masculino</option>

                                    <option value="Femenino">Femenino</option>

                                    <option value="Therian">Therian</option>

                                </select>

                            </div>

                        </div>

                    </div>

                    <div class="field">

                        <label class="label">Cargo</label>

                        <div class="control">

                            <input
                                class="input"
                                type="text"
                                id="cargo"
                                placeholder="Ej: Administrador">

                        </div>

                    </div>

                </div>

            </div>

            <div class="botones">

                <button
                    id="btnGuardar"
                    class="button boton-guardar">

                    Guardar Usuario

                </button>

                <button id="btnInicio">

                    Volver al inicio

                </button>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="../js/usuarios.js"></script>

</body>

</html>
